<?xml version="1.0" encoding="utf-8" standalone="yes"?>
<PHONE_CONFIG>
  <!-- 1. Turn on the background Presence monitoring sub-system natively -->
  <feature feature.presence.enabled="1" />

  <!-- 2. Re-establish Attendant mapping using clean, flat structure tags -->
  <attendant attendant.reg="1" attendant.type="dialog">
    <attendant.resourceList attendant.resourceList.1.address="1728995" attendant.resourceList.1.label="Ext 1728995" attendant.resourceList.1.type="normal" />
  </attendant>

  <!-- 3. Force map onto Key 2 using ResourceList Category -->
  <lineKey lineKey.reassignment.enabled="1" lineKey.2.category="ResourceList" lineKey.2.index="1" />

  <!-- 4. Explicitly allow Line 1 to manage background buddy subscriptions -->
  <reg reg.1.buddies="1" />
</PHONE_CONFIG>
