<?xml version="1.0" encoding="utf-8" standalone="yes"?>
<PHONE_CONFIG>
  <!-- 1. Turn on the background Presence monitoring sub-system -->
  <feature feature.presence.enabled="1" />

  <!-- 2. Create your BLF Target under the modern Buddies list -->
  <buddies 
    buddies.buddies.1.address="1728995" 
    buddies.buddies.1.label="Ext 1728995" 
    buddies.buddies.1.presence="1" />

  <!-- 3. Explicitly link Buddy index 1 straight onto physical Line Key 2 -->
  <lineKey 
    lineKey.reassignment.enabled="1" 
    lineKey.2.category="SpeedDial" 
    lineKey.2.index="1" />
</PHONE_CONFIG>
