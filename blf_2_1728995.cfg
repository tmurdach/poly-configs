<?xml version="1.0" encoding="utf-8" standalone="yes"?>
<PHONE_CONFIG>
  <!-- 1. Globally enable the phone's local presence engine -->
  <feature feature.presence.enabled="1" />

  <!-- 2. Force the phone to handle attendant lists as localized dialog states -->
  <attendant attendant.reg="1" attendant.event="dialog">
    <attendant.resourceList 
      attendant.resourceList.1.address="1728995" 
      attendant.resourceList.1.label="Ext 1728995" 
      attendant.resourceList.1.type="normal" />
  </attendant>

  <!-- 3. Explicitly assign the resource list to line key 2 -->
  <lineKey 
    lineKey.reassignment.enabled="1" 
    lineKey.2.category="ResourceList" 
    lineKey.2.index="1" />
</PHONE_CONFIG>
