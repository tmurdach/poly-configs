<?xml version="1.0" standalone="yes"?>
<PHONE_CONFIG>
  <!-- 1. BLF Parameters with Type changed to BLF -->
  <attendant attendant.reg="1">
    <attendant.resourceList 
      attendant.resourceList.1.address="1728995" 
      attendant.resourceList.1.label="Ext 1728995"
      attendant.resourceList.1.type="BLF" />
  </attendant>

  <!-- 2. Force mapped onto Key 2 using ResourceList -->
  <lineKey
    lineKey.reassignment.enabled="1"
    lineKey.2.category="ResourceList"
    lineKey.2.index="1" />

  <!-- 3. Genesys Cloud Connection Parameters -->
  <voIpProt>
    <voIpProt.server 
      voIpProt.server.1.address="primary.sip-service.usw2.pure.cloud" 
      voIpProt.server.1.port="8061" 
      voIpProt.server.1.transport="TLS" />
    <voIpProt.SIP>
      <voIpProt.SIP.local voIpProt.SIP.local.port="8061" />
    </voIpProt.SIP>
  </voIpProt>
</PHONE_CONFIG>
