<?xml version="1.0" encoding="utf-8" standalone="yes"?>
<!--Description: Enables a Redial Softkey for VVX-->
<PHONE_CONFIG>
<conference
# Enable custom softkey layout
feature.enhancedFeatureKeys.enabled="1"
softkey.feature.conference="1"

# Define softkey layout for active calls (page 1)
softkey.1.label="Conference"
softkey.1.action="conference"
softkey.1.state="connected"
softkey.1.page="1"
/>
</PHONE_CONFIG>
