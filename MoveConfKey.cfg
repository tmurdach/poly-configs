<?xml version="1.0" encoding="utf-8" standalone="yes"?>
<!--Description: Enables a Redial Softkey for VVX-->
<PHONE_CONFIG>
<softkey feature.enhancedFeatureKeys.enabled="1">
    <!-- Active Call State Softkeys -->
    <softkey.1.label>Confrnc</softkey.1.label>
    <softkey.1.action>Confrnc</softkey.1.action>
    <softkey.1.state>connected</softkey.1.state>

    <!-- Example: Keep Hold on Page 1 -->
    <softkey.2.label>Hold</softkey.2.label>
    <softkey.2.action>Hold</softkey.2.action>
    <softkey.2.state>connected</softkey.2.state>

    <!-- Add other softkeys as needed -->
</softkey>

 </PHONE_CONFIG>
