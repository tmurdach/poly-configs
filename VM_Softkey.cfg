<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<!-- Softkey Configuration File-->
<!-- removes original IDLE Softkey's-->
<!-- changes forward Softkey to toggle between forward on/off to fixed destination-->
<!-- add's new softkey to dial Voicemail and send User and Password via DTMF-->
<!-- *******************************************-->
<!-- * Only compatible with UCS 3.3.x or newer *-->
<!-- *******************************************-->
<!-- Source: http://community.polycom.com/t5/VoIP/FAQ-Using-Enhanced-Feature-Keys-EFK-macros-to-change-softkey/td-p/6544-->
<!-- For information on configuring Polycom VoIP phones please refer to the -->
<!-- Configuration File Management white paper available from: -->
<!-- http://www.polycom.com/common/documents/whitepapers/configuration_file_management_on_soundpoint_ip_phones.pdf -->
<polycomConfig xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="polycomConfig.xsd">
  <feature>
    <feature.enhancedFeatureKeys feature.enhancedFeatureKeys.enabled="1"></feature.enhancedFeatureKeys>
  </feature>
  <softkeyoff>
  <softkey softkey.feature.newcall="0" softkey.feature.forward="0"/>
  </softkeyoff>
  <softkey2>
  <softkey softkey.1.action="$FDivert$$FSelect$$FSoftKey2$" softkey.1.enable="1" softkey.1.label="Forward" softkey.1.use.idle="1" />
  </softkey2>
  <softkey3>
  <softkey softkey.2.action="*86$Tinvite$$Cwaitconnect$$Cpause8$1729989$Tdtmf$$Cpause10$6776$Tdtmf$" softkey.2.enable="1" softkey.2.label="VM" softkey.2.use.idle="1" />
  </softkey3>
  <divertcontact>
  <divert divert.1.contact="*86"/>
  </divertcontact>
</polycomConfig>
