<?xml version="1.0" encoding="utf-8"?>
<PHONE_CONFIG>
 <EdgeE300_device_settings 
  apps.restapi.enabled="1" 
  up.screenCapture.allowed="1" 
  up.screenCapture.enabled="1" 
  httpd.enabled="1" 
  httpd.cfg.enabled="1" 
  httpd.cfg.port="80" 
  httpd.cfg.secureTunnelEnabled="1" 
  httpd.cfg.secureTunnelPort="443" 
  httpd.cfg.secureTunnelRequired="0"
 />
 <feature
  feature.enhancedFeatureKeys.enabled="1" 
  homeScreen.forward.enable="0"
  homeScreen.doNotDisturb.enable="0"
  homeScreen.wifi.enable="0"
  softkey.feature.forward="0"
  feature.doNotDisturb.enable="0"
  feature.forward.enable="0"
  softkey.feature.newcall="0"
  homeScreen.newCall.enable="0"
 />
 <logging
  log.render.file.size="1000"
  log.render.level="0"
  log.level.change.ice="0"
  log.level.change.pps="0"
  log.level.change.sip="0"
  log.level.change.so="0"
  log.level.change.pcap="0"
 />
 <!-- 1 = Label the Line key with the number, 0 = Show the name -->
 <reg 
   reg.1.useTelUriAsLineLabel="1"
 />
  <idle_softkey_1 
    softkey.1.action="$FRedial$" 
    softkey.1.enable="1" 
    softkey.1.label="Redial" 
    softkey.1.use.idle="1" 
    efk.softkey.alignleft="1" 
    softkey.1.precede="1" 
  />  
  <transfer_softkey_1 
    softkey.1.action="$FJoin$" 
    softkey.1.enable="1" 
    softkey.1.label="Join" 
    softkey.1.use.transfer="1" 
    efk.softkey.alignleft="1" 
    softkey.1.precede="1" 
  /> 



</PHONE_CONFIG>
