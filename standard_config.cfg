<?xml version="1.0" encoding="utf-8"?>
<customizations>
<!--	
Enable API and debug level logging
-->
<reg reg.1.lineKeys="3" />
<apps apps.restapi.enabled="1" />
<up up.screenCapture.allowed="1" up.screenCapture.enabled="1" />
<log log.level.change.pcap="0" />
<log log.level.change.sip="0" />
<log log.render.level="0" />
<device device.set="1" />
<!—HTTP and HTTPS Admin Settings -->
<httpd httpd.enabled="1" httpd.cfg.enabled="1" httpd.cfg.port="80" httpd.cfg.secureTunnelEnabled="1" httpd.cfg.secureTunnelPort="443" httpd.cfg.secureTunnelRequired="0" />
</customizations>
