<?xml version="1.0" encoding="utf-8"?>
<customizations>
	<!--	
	Enable API and debug level logging
	-->
	<web
	device.set="1"
    apps.restapi.enabled="1"
    log.level.change.httpa="0"
    log.level.change.net="0"
    log.level.change.pcap="0"
    log.level.change.pkt="0"
    log.level.change.sip="0"
    log.level.change.sipp="0"
    log.level.change.sipt="0"
    log.level.change.srtp="0"
    log.level.change.sshc="0"
    log.render.level="0"
	/>

</customizations>
